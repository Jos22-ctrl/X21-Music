appId: com.x21.music
productName: X21 Music
copyright: Copyright © 2026 X21 Team Group
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
icon: build/icon.png
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  include: build/installer.nsh
