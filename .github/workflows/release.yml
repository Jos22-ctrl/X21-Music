name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run dist:win

      # La etiqueta es vX.Y.Z (sin letra); la letra y el resumen salen del CHANGELOG.
      - name: Leer la versión publicada
        id: nota
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "La etiqueta debe ser vX.Y.Z sin letra: $tag"
          }
          $version = $tag.TrimStart('v')
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $pkgVersion) {
            throw "La etiqueta $version no coincide con package.json ($pkgVersion)"
          }
          $patron = '^## \[' + [regex]::Escape($version) + '([AMTF])\] - \d{4}-\d{2}-\d{2} — (.+)$'
          $entrada = Select-String -Path CHANGELOG.md -Pattern $patron | Select-Object -First 1
          if (-not $entrada -or $entrada.Line -notmatch $patron) {
            throw "Falta la entrada de $version en CHANGELOG.md"
          }
          "letra=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          "descripcion=$($Matches[2])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      # GitHub publica el .exe con puntos en lugar de espacios; la suma debe usar ese nombre.
      - name: Generar el SHA-256
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $exe = "release/X21 Music Setup $version.exe"
          $asset = "X21.Music.Setup.$version.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Path "release/X21 Music Setup $version.exe.sha256" -Encoding ascii

      - name: Publicar el release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $titulo = "Alpha $version${{ steps.nota.outputs.letra }} — ${{ steps.nota.outputs.descripcion }}"
          gh release create "${{ github.ref_name }}" `
            "release/X21 Music Setup $version.exe" `
            "release/X21 Music Setup $version.exe.sha256" `
            --title "$titulo" `
            --notes "Instalador NSIS x64 de X21 Music $titulo. El detalle de cambios está en CHANGELOG.md y en «Acerca de»."
